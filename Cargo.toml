[package]
name = "skin-studio-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Standalone procedural skin material studio with a custom wgpu preview renderer"
license = "MIT"

[dependencies]
eframe = { version = "0.36.2", default-features = true, features = ["wgpu"] }
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.30", features = ["bytemuck"] }
half = "2.7"
rustfft = "6.4"
gltf = { version = "1.4", features = ["import"] }
rfd = "0.16"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
